workflows:

  # ══════════════════════════════════════════════════════════════════
  # WORKFLOW 1 — NaturaBridgeB iOS (iPhone + iPad) → TestFlight
  # ══════════════════════════════════════════════════════════════════
  naturabridgeb-ios-testflight:
    name: "NaturaBridgeB — iPhone + iPad → TestFlight"
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      groups:
        - app-store-connect
        - ios-signing
      vars:
        BUNDLE_ID:     "com.naturabridge.business"
        APPLE_TEAM_ID: "V44J4P68PU"
      node: "20"
      xcode: latest
      cocoapods: "1.15.2"

    scripts:

      - name: Install Node dependencies
        script: npm ci

      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Set up keychain
        script: keychain initialize

      # One distribution certificate is shared by the three NaturaBridge apps:
      # CERTIFICATE_PRIVATE_KEY (group ios-signing) holds the same key in each
      # Codemagic app, so this step finds the existing certificate instead of
      # creating another one. Apple allows three per account; separate keys per
      # app is what exhausted them in June and again in September 2026.
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier \
            --key-id "$APP_STORE_CONNECT_KEY_ID"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Set version and build number
        script: |
          VERSION="$(node -p "require('./package.json').version")"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/g" ios/App/App.xcodeproj/project.pbxproj
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - admin@alphainception.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # External groups only. The internal group ("tester int") receives every
        # build automatically; naming it here makes Apple reject the request and
        # the beta-review submission is then skipped.
        beta_groups:
          - "testers external"


  # ══════════════════════════════════════════════════════════════════
  # WORKFLOW 2 — NaturaBridgeB macOS (Mac Catalyst) → TestFlight
  # ══════════════════════════════════════════════════════════════════
  naturabridgeb-macos-testflight:
    name: "NaturaBridgeB — Mac → TestFlight"
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.naturabridge.business
      groups:
        - app-store-connect
        - ios-signing
      vars:
        BUNDLE_ID:     "com.naturabridge.business"
        APPLE_TEAM_ID: "V44J4P68PU"
      node: "20"
      xcode: latest
      cocoapods: "1.15.2"

    scripts:

      - name: Install Node dependencies
        script: npm ci

      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Enable Mac Catalyst
        script: |
          gem install xcodeproj --quiet
          ruby << 'RUBY'
            require 'xcodeproj'
            project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            project.targets.each do |target|
              next unless target.name == 'App'
              target.build_configurations.each do |config|
                config.build_settings['SUPPORTS_MACCATALYST']                        = 'YES'
                config.build_settings['DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER'] = 'NO'
                config.build_settings['MACCATALYST_APPLICATION_IDENTIFIER']           = 'com.naturabridge.business'
                config.build_settings['MACOSX_DEPLOYMENT_TARGET']                    = '13.0'
              end
            end
            project.save
          RUBY

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build macOS archive (Mac Catalyst)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/NaturaBridgeB-macOS.xcarchive" \
            -destination "platform=macOS,variant=Mac Catalyst" \
            OTHER_CODE_SIGN_FLAGS="--keychain $(echo $CM_KEYCHAIN_PATH)" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            CODE_SIGN_IDENTITY="$CODE_SIGNING_IDENTITY" \
            archive | xcpretty

      - name: Export macOS app
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/NaturaBridgeB-macOS.xcarchive" \
            -exportOptionsPlist build-config/ExportOptions-macOS.plist \
            -exportPath "$CM_BUILD_DIR/build/pkg-macos"

    artifacts:
      - $CM_BUILD_DIR/build/pkg-macos/**
      - $CM_BUILD_DIR/build/NaturaBridgeB-macOS.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - admin@alphainception.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # External groups only. The internal group ("tester int") receives every
        # build automatically; naming it here makes Apple reject the request and
        # the beta-review submission is then skipped.
        beta_groups:
          - "testers external"


  # ══════════════════════════════════════════════════════════════════
  # WORKFLOW 3 — NaturaBridgeB Windows → NSIS .exe installer
  # ══════════════════════════════════════════════════════════════════
  naturabridgeb-windows:
    name: "NaturaBridgeB — Windows → NSIS installer"
    max_build_duration: 30
    instance_type: windows_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      node: "20"

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build Windows installer
        script: npm run build:win

    artifacts:
      - dist-electron/*.exe
      - dist-electron/*.yml

    publishing:
      email:
        recipients:
          - admin@alphainception.com
        notify:
          success: true
          failure: true


  # ══════════════════════════════════════════════════════════════════
  # WORKFLOW 4 — NaturaBridgeB Android → Google Play (internal track, draft)
  # Started manually. Before the first run, create in Codemagic:
  #   * Code signing identities > Android keystores: upload
  #     05_Secrets/naturabridgeb-upload-keystore.jks with reference name
  #     `naturabridgeb_upload` (alias `upload`).
  #   * Environment group `google_play` with GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #     (JSON key of a Play Console service account with release permission).
  # The Play Console app for com.naturabridge.business must exist first, and the very
  # first bundle has to be uploaded by hand in Play Console.
  # ══════════════════════════════════════════════════════════════════
  naturabridgeb-android:
    name: "NaturaBridgeB — Android → Google Play internal"
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      android_signing:
        - naturabridgeb_upload
      groups:
        - google_play
      node: "22"
      java: 21

    scripts:

      - name: Install Android wrapper dependencies
        script: cd android-app && npm ci

      - name: Sync web assets
        script: cd android-app && npx cap sync android

      - name: Write keystore.properties from the Codemagic keystore
        script: |
          cat > android-app/android/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Build signed bundle
        script: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCodeOverride=$PROJECT_BUILD_NUMBER

    artifacts:
      - android-app/android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - admin@alphainception.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
